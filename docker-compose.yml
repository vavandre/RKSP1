version: "3.9"

services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/data
    environment:
      - PORT=4000
      - JWT_SECRET=change-me-in-production
      - DB_PATH=./data/infra.db
      - CORS_ORIGIN=http://localhost:8080

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
