name: kr-rksp

services:
  postgres:
    image: postgres:16-alpine
    container_name: infra-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infra_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infra_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: infra-management-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      JWT_SECRET: change-me-in-production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: infra_management
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    container_name: infra-management-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data:
